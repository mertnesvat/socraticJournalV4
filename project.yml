name: SocraticJournal
options:
  bundleIdPrefix: com.StudioNext
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
  AppsFlyerFramework:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework.git
    from: "6.15.0"

targets:
  SocraticJournal:
    type: application
    platform: iOS
    sources:
      - path: Sources/SocraticJournal
        excludes:
          - "**/.DS_Store"
      - path: GoogleService-Info.plist
        buildPhase: resources
        type: file
    resources:
      - path: Sources/SocraticJournal/Resources/prompt_bank.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.StudioNext.socraticJournal
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "9"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAnalytics
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseFunctions
      - package: firebase-ios-sdk
        product: FirebaseMessaging
      - package: AppsFlyerFramework
        product: AppsFlyerLib
      - target: CircleWidget
    entitlements:
      path: SocraticJournal.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.StudioNext.socraticJournal

  CircleWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Sources/CircleWidget/Info.plist
      properties:
        CFBundleDisplayName: Circle Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: Sources/CircleWidget
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.StudioNext.socraticJournal.CircleWidget
        INFOPLIST_KEY_CFBundleDisplayName: Circle Widget
        INFOPLIST_KEY_NSWidgetWantsLocation: false
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "9"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Sources/CircleWidget/CircleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.StudioNext.socraticJournal
    dependencies: []

  SocraticJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SocraticJournalTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.StudioNext.socraticJournalTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SocraticJournal

schemes:
  SocraticJournal:
    build:
      targets:
        SocraticJournal: all
        CircleWidget: all
        SocraticJournalTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Configuration/StoreKit.storekit
    test:
      config: Debug
      targets:
        - SocraticJournalTests
      storeKitConfiguration: Configuration/StoreKit.storekit
    archive:
      config: Release
  CircleWidget:
    build:
      targets:
        CircleWidget: all
    run:
      config: Debug
    archive:
      config: Release
