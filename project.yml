name: SocraticJournal
options:
  bundleIdPrefix: com.StudioNext
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"

targets:
  SocraticJournal:
    type: application
    platform: iOS
    sources:
      - path: Sources/SocraticJournal
        excludes:
          - "**/.DS_Store"
      - path: GoogleService-Info.plist
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.StudioNext.socraticJournal
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "9"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAnalytics
    entitlements:
      path: SocraticJournal.entitlements
      properties:
        aps-environment: development

  SocraticJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SocraticJournalTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.StudioNext.socraticJournalTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SocraticJournal

schemes:
  SocraticJournal:
    build:
      targets:
        SocraticJournal: all
        SocraticJournalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SocraticJournalTests
    archive:
      config: Release
